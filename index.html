<style>
:root{--bg:#050507;--card:#111116;--line:#2b161b;--red:#c4122a;--red2:#ff4a63;--tx:#fff;--mu:#b9b4bd;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:500 16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0,#1a0509 0,var(--bg) 60%)}
header{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:rgba(5,5,7,.85)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--red);flex:none}
.hd{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.hd b{font:800 15px Montserrat,Inter,sans-serif;letter-spacing:.14em}
.hd span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--tx);flex:none;transition:background .15s,color .15s}
.ib:hover{background:rgba(196,18,42,.18);color:var(--red2)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#hero{margin:auto;text-align:center;padding:12px 4px;max-width:520px}
#hero img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--red);box-shadow:0 0 34px rgba(196,18,42,.45)}
#hero h1{font:800 22px Montserrat,Inter,sans-serif;letter-spacing:.14em;margin:14px 0 4px}
#hero p{margin:0 0 16px;color:var(--mu);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px;transition:border-color .15s,background .15s}
.chips button:hover{border-color:var(--red);background:rgba(196,18,42,.14)}
.row{display:flex;max-width:100%}
.row.u{justify-content:flex-end}
.bub{max-width:min(86%,560px);padding:10px 14px;border-radius:18px;overflow-wrap:anywhere;word-break:break-word;font-size:16px}
.u .bub{background:linear-gradient(#d0152e,#8f0c1f);border-bottom-right-radius:6px}
.b .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.b .bub.err{border-color:var(--red);color:#ffb3bd}
.bub a{color:var(--red2)}
.bub audio{display:block;width:min(240px,64vw);height:40px;margin-bottom:6px}
.bub small{display:block;opacity:.85;font-size:14px}
.spk{margin:4px 0 0 -6px;display:flex}
.spk button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:0;border-radius:18px;background:transparent;color:var(--mu);font-size:13px}
.spk button:hover,.spk button.on{color:var(--red2)}
.spk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--red2);animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#bar{flex:none;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));background:rgba(5,5,7,.92);border-top:1px solid var(--line)}
#box,#rec{display:flex;align-items:flex-end;gap:6px;padding:5px 5px 5px 14px;border:1px solid var(--line);border-radius:26px;background:var(--card);transition:border-color .15s}
#box:focus-within{border-color:var(--red)}
#rec{align-items:center;border-color:var(--red);min-height:54px}
#rec[hidden],#box[hidden]{display:none}
#in{flex:1;min-width:0;min-height:44px;max-height:140px;margin:0;padding:10px 0;border:0;outline:0;resize:none;background:transparent;color:var(--tx);font-size:16px;line-height:1.4;font-weight:500;font-family:inherit;overflow-y:auto}
#in::placeholder{color:#8d8791}
#go{background:linear-gradient(#d0152e,#8f0c1f);color:#fff}
#go:disabled{background:#241216;color:#6d6169;cursor:default}
#mic.hot{color:var(--red2)}
#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red2);animation:bl 1s infinite;flex:none}
#rec .tm{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.note{margin:6px 0 0;text-align:center;font-size:11px;color:#8d8791}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:14px;background:#1b0b0f;border:1px solid var(--red);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(min-width:760px){#app{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){.dots i,#rec .dot{animation:none}}
</style></head><body>

<div id="toast" role="status"></div>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s),app=$("#app"),feed=$("#feed"),inp=$("#in"),go=$("#go"),mic=$("#mic");
let hist=[],busy=false,rec=null,speaking=null;
try{hist=JSON.parse(sessionStorage.getItem("gcb")||"[]")}catch(e){}
const save=()=>{try{sessionStorage.setItem("gcb",JSON.stringify(hist.slice(-30)))}catch(e){}};
hist=hist.filter(m=>!(
 m&&m.role==="user"&&
 typeof m.content==="string"&&
 /^\/master(?:\s|$)/i.test(m.content.trim())
));
save();
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https:\/\/[^\s<]*[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,"<br>");
const down=()=>requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight});
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200)};

// keep the whole app exactly the size of the visible screen, so the text box rides above the keyboard on iPhone and Android
const vv=window.visualViewport;
const fit=()=>{const h=vv?vv.height:innerHeight;app.style.height=h+"px";app.style.top=(vv?vv.offsetTop:0)+"px";if(!vv||vv.offsetTop)scrollTo(0,0);down()};
if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,250));fit();

const grow=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px";go.disabled=busy||!inp.value.trim()};
inp.addEventListener("input",grow);
inp.addEventListener("focus",()=>setTimeout(()=>{fit();down()},300));
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&matchMedia("(pointer:fine)").matches){e.preventDefault();submit()}});
go.onclick=submit;
function submit(){  const t=inp.value.trim();  if(!t||busy)return;   inp.value="";  grow();   if(/^\/master(?:\s|$)/i.test(t)){    activateMaster(t);    return;  }   send(t); }

const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/></svg>';
function row(role,html,clip){const r=document.createElement("div");r.className="row "+role;const b=document.createElement("div");b.className="bub";b.innerHTML=html;if(clip){const a=document.createElement("audio");a.controls=true;a.preload="metadata";a.src=URL.createObjectURL(clip);b.prepend(a)}r.append(b);feed.append(r);down();return r}
function botRow(text,err){const r=row("b",fmt(text));if(err)r.firstChild.classList.add("err");else if("speechSynthesis"in window){const s=document.createElement("div");s.className="spk";s.innerHTML='<button type="button" aria-label="Read this aloud">'+SPK+'Listen</button>';s.firstChild.onclick=()=>speak(text,s.firstChild);r.firstChild.append(s)}return r}
function clean(t){return t.replace(/https?:\/\/\S+/g,"").replace(/\*\*/g,"")}
function speak(text,btn){const ss=window.speechSynthesis;if(!ss)return;const same=speaking===btn;ss.cancel();document.querySelectorAll(".spk .on").forEach(b=>b.classList.remove("on"));speaking=null;if(same)return;const u=new SpeechSynthesisUtterance(clean(text));const v=ss.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.rate=1;speaking=btn;if(btn)btn.classList.add("on");u.onend=u.onerror=()=>{if(btn)btn.classList.remove("on");speaking=null};ss.speak(u)}
const wantsAudio=t=>/\b(say it|say that|read (it|that|this) (out|aloud)|out loud|speak (it|to me)|voice (reply|message|note)|audio|in voice|talk to me)\b/i.test(t);

async function ask(msgs){
 if(window.previewAsk)return window.previewAsk(msgs);
 const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||"Server error "+r.status);
 return d.reply}

async function send(text,clip){
 text=text.trim();if(!text||busy)return;
 const h=$("#hero");if(h)h.remove();
 busy=true;go.disabled=true;
 row("u",(clip?"<small>":"")+esc(text).replace(/\n/g,"<br>")+(clip?"</small>":""),clip);
 hist.push({role:"user",content:text});save();
 const ty=row("b",'<span class="dots"><i></i><i></i><i></i></span>');
 try{const reply=await ask(hist.slice(-20));ty.remove();botRow(reply);hist.push({role:"assistant",content:reply});save();if(wantsAudio(text)){const b=feed.lastChild.querySelector(".spk button");speak(reply,b)}}
 catch(e){ty.remove();hist.pop();save();botRow("Couldn’t get an answer. "+(e&&e.message&&!/fetch|network/i.test(e.message)?e.message:"Check your connection and try again."),true);if(!clip){inp.value=text;grow()}}
 finally{busy=false;grow();if(matchMedia("(pointer:fine)").matches)inp.focus()}}

 async function activateMaster(command){
 busy=true;
 go.disabled=true;

 try{
   const r=await fetch("/api/chat",{
     method:"POST",
     credentials:"same-origin",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       messages:[{role:"user",content:command}]
     })
   });

   const d=await r.json().catch(()=>({}));

   if(!r.ok) throw new Error(d.error||"Master Mode activation failed.");

   if(d.masterMode!==true){
     throw new Error("Master Mode could not be verified.");
   }

   botRow(d.reply||"Oh, Master! It's you. What are we doing today?");
   toast("Master Mode activated.");
 }catch(e){
   botRow(e.message||"Master Mode activation failed.",true);
 }finally{
   busy=false;
   grow();
   if(matchMedia("(pointer:fine)").matches)inp.focus();
 }
} 

// restore this session's chat
if(hist.length){const h=$("#hero");if(h)h.remove();hist.forEach(m=>m.role==="user"?row("u",esc(m.content).replace(/\n/g,"<br>")):botRow(m.content))}
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>send(b.textContent));
$("#new").onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();hist=[];save();location.reload()};

// voice messages: record a clip, transcribe it with the browser, send the words to the AI
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const tick=()=>{const s=Math.floor((Date.now()-rec.t0)/1000);$("#tm").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s>=120)stopRec(true)};
function ui(on){$("#rec").hidden=!on;$("#box").hidden=on}
async function startRec(){
 if(rec||busy)return;
 if(!navigator.mediaDevices||!window.MediaRecorder){toast("Voice messages aren’t supported on this browser.");return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Mic is blocked. Allow it in your browser settings.");return}
 const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
 const mr=new MediaRecorder(st,mt?{mimeType:mt}:{}),r={mr,st,ch:[],text:"",t0:Date.now(),go:false};
 mr.ondataavailable=e=>{if(e.data&&e.data.size)r.ch.push(e.data)};
 mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearInterval(r.iv);
  if(r.sr)await new Promise(res=>{r.sr.onend=res;try{r.sr.stop()}catch(e){res()}setTimeout(res,900)});
  ui(false);rec=null;if(!r.go)return;
  const clip=new Blob(r.ch,{type:mr.mimeType||"audio/webm"}),txt=r.text.trim();
  if(txt)send(txt,clip);else{const h=$("#hero");if(h)h.remove();row("u","<small>Voice message</small>",clip);botRow("Couldn’t catch any words in that. Try again or just type it.",true)}};
 if(SR){try{const sr=new SR();sr.lang=navigator.language||"en-US";sr.continuous=true;sr.interimResults=false;sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)r.text+=e.results[i][0].transcript+" "};sr.onerror=()=>{};sr.start();r.sr=sr}catch(e){}}
 if(window.speechSynthesis)speechSynthesis.cancel();
 rec=r;mr.start();ui(true);$("#tm").textContent="0:00";r.iv=setInterval(tick,500)}
function stopRec(send){if(!rec)return;rec.go=send;try{rec.mr.stop()}catch(e){ui(false);rec=null}}
mic.onclick=startRec;$("#rs").onclick=()=>stopRec(true);$("#rc").onclick=()=>stopRec(false);
grow();
})();
</script>
</body></html>
